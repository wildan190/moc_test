name: CI/CD Pipeline - Production Build & Deploy (Coolify Ready)

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ============================================================================
  # STAGE 1: Backend Automated Tests (Laravel + PostgreSQL + Redis)
  # ============================================================================
  backend-test:
    name: 🧪 Backend Tests (Laravel)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: manchester
          POSTGRES_DB: db_moc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql, pgsql, redis, zip, bcmath, gd, intl, pcntl
          coverage: none

      - name: Install Composer Dependencies
        working-directory: backend-restaurant
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy Testing Environment
        working-directory: backend-restaurant
        run: cp .env.example .env

      - name: Generate App Key
        working-directory: backend-restaurant
        run: php artisan key:generate

      - name: Run Database Migrations
        working-directory: backend-restaurant
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: db_moc_test
          DB_USERNAME: root
          DB_PASSWORD: manchester

      - name: Run PHPUnit Tests
        working-directory: backend-restaurant
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: db_moc_test
          DB_USERNAME: root
          DB_PASSWORD: manchester
          QUEUE_CONNECTION: sync
          CACHE_STORE: array
          SESSION_DRIVER: array

  # ============================================================================
  # STAGE 2: Frontend Automated Tests (Next.js & Vitest)
  # ============================================================================
  frontend-test:
    name: 🧪 Frontend Tests (Next.js & Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-restaurant/package-lock.json

      - name: Install NPM Dependencies
        working-directory: frontend-restaurant
        run: npm ci

      - name: Run Unit Tests (Vitest)
        working-directory: frontend-restaurant
        run: npm test -- --run
        env:
          NEXT_PUBLIC_API_URL: http://localhost/api

  # ============================================================================
  # STAGE 3: Build & Push Pre-Built Docker Images (Zero Server Overhead)
  # ============================================================================
  build-and-push:
    name: 🐳 Build & Push Docker Images (GHCR)
    needs: [backend-test, frontend-test]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Mirror Base Images to GHCR (Zero TCP resets on VPS)
      # ------------------------------------------------------------------------
      - name: Mirror Base Images to GHCR (PostgreSQL 18, Redis 7, Nginx)
        run: |
          echo "Mirroring postgres:18-alpine..."
          docker pull postgres:18-alpine
          docker tag postgres:18-alpine ghcr.io/${{ github.repository }}/postgres:18-alpine
          docker push ghcr.io/${{ github.repository }}/postgres:18-alpine

          echo "Mirroring redis:7-alpine..."
          docker pull redis:7-alpine
          docker tag redis:7-alpine ghcr.io/${{ github.repository }}/redis:7-alpine
          docker push ghcr.io/${{ github.repository }}/redis:7-alpine

          echo "Building & pushing nginx with production config baked in..."
          docker build -t ghcr.io/${{ github.repository }}/nginx:alpine -f deploy/nginx/Dockerfile .
          docker push ghcr.io/${{ github.repository }}/nginx:alpine

      # ------------------------------------------------------------------------
      # Build & Push: Backend Image (PHP 8.4-FPM Production)
      # ------------------------------------------------------------------------
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-restaurant
          file: ./backend-restaurant/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------------
      # Build & Push: Frontend Image (Next.js Standalone Runner)
      # ------------------------------------------------------------------------
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-restaurant
          file: ./frontend-restaurant/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-dishy.phoenixtech.web.id/api
            NEXT_PUBLIC_APP_URL=https://dishy.phoenixtech.web.id
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STAGE 4: Deployment Trigger (Coolify Webhook / SSH Fallback)
  # ============================================================================
  deploy:
    name: 🚀 Deploy to Coolify / Production
    needs: [build-and-push]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # Option A: Trigger Deployment via Coolify Webhook / API
      - name: Trigger Coolify Webhook
        env:
          COOLIFY_DEPLOY_KEY: ${{ secrets.COOLIFY_DEPLOY_KEY }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          echo "Triggering deployment in Coolify..."
          
          DEFAULT_WEBHOOK="https://coolify.phoenixtech.web.id/api/v1/deploy?uuid=oo9rzr6qzzjjfzqfqstcadlz&force=false"
          WEBHOOK_URL="${COOLIFY_WEBHOOK_URL:-$DEFAULT_WEBHOOK}"
          CLEAN_WEBHOOK=$(echo "$WEBHOOK_URL" | xargs)
          
          TARGET_HOST=$(echo "$CLEAN_WEBHOOK" | awk -F[/:] '{print $4}')
          echo "Connecting to host: $TARGET_HOST"

          if [ "$TARGET_HOST" = "localhost" ] || [ "$TARGET_HOST" = "127.0.0.1" ]; then
            echo "::error ::COOLIFY_WEBHOOK_URL menggunakan '$TARGET_HOST'. GitHub Actions berjalan di internet publik dan tidak dapat mengakses localhost server Anda. Gunakan domain publik atau IP publik server Coolify Anda."
            exit 1
          fi

          AUTH_ARGS=()
          if [ -n "$COOLIFY_DEPLOY_KEY" ]; then
            echo "Menggunakan secret COOLIFY_DEPLOY_KEY (Bearer authentication)..."
            AUTH_ARGS=(-H "Authorization: Bearer $COOLIFY_DEPLOY_KEY")
          else
            echo "::warning ::Secret COOLIFY_DEPLOY_KEY belum diset. Memanggil webhook tanpa header Authorization..."
          fi

          http_response=$(curl -sS -w "\n%{http_code}" -X GET "${AUTH_ARGS[@]}" "$CLEAN_WEBHOOK" 2>&1) || curl_exit=$?
          
          if [ "${curl_exit:-0}" -ne 0 ]; then
            echo "::error ::Gagal menghubungi Coolify (curl exit code: $curl_exit). Pesan error: $http_response"
            exit $curl_exit
          fi

          http_code=$(echo "$http_response" | tail -n1)
          body=$(echo "$http_response" | head -n-1)
          echo "Coolify response HTTP: $http_code"
          echo "Response body: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Coolify deployment triggered successfully (HTTP $http_code)!"
          else
            echo "::error ::Coolify returned HTTP $http_code. Response: $body. Periksa COOLIFY_DEPLOY_KEY atau UUID webhook."
            exit 1
          fi

      # Option B: Fallback Deploy via SSH (if SERVER_HOST is configured and Coolify webhook not used)
      - name: SSH and Deploy on Server
        if: failure() && env.SERVER_HOST != ''
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.SERVER_DEPLOY_PATH || '/var/www/restaurant' }}
            git pull origin main || git pull origin master
            export IMAGE_TAG=${{ github.sha }}
            chmod +x deploy.sh
            ./deploy.sh
