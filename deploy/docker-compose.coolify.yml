# ==============================================================================
# Coolify Production Docker Compose (deploy/docker-compose.coolify.yml)
# Optimized for Coolify v4 (Traefik / Caddy Reverse Proxy & Auto SSL)
# Uses pre-built images from GitHub Actions to keep Coolify server CPU/RAM near 0
# ==============================================================================

services:
  # ============================================================================
  # NGINX GATEWAY (Coolify Public Entrypoint)
  # Receives traffic from Coolify Proxy (Traefik/Caddy) with SSL already terminated
  # Routes /api and /storage to Laravel, routes / to Next.js
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: resto_coolify_nginx
    restart: always
    expose:
      - "80"
    volumes:
      - ./nginx/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_public_storage:/var/www/public/storage:ro
    depends_on:
      - frontend
      - backend
    environment:
      # Coolify automatically routes your domain and provisions SSL for this port
      - SERVICE_FQDN_NGINX_80
    networks:
      - resto_net

  # ============================================================================
  # FRONTEND: Next.js (Pre-built in GitHub Actions, Standalone Runner)
  # ============================================================================
  frontend:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-wildanbelfiore/moc_test}/frontend:${IMAGE_TAG:-latest}
    container_name: resto_coolify_frontend
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost}
      NEXT_PUBLIC_PIESOCKET_CLUSTER_ID: ${PIESOCKET_CLUSTER_ID:-free.blr2}
      NEXT_PUBLIC_PIESOCKET_API_KEY: ${PIESOCKET_API_KEY:-F6y6bNEzxhFn3gkxubwElu1KPdFHuRKzICDsfPO9}
      NEXT_PUBLIC_PIESOCKET_CHANNEL_ID: ${PIESOCKET_CHANNEL_ID:-1}
      NEXT_PUBLIC_PIESOCKET_WS_URL: ${NEXT_PUBLIC_PIESOCKET_WS_URL:-wss://free.blr2.piesocket.com/v3/1?api_key=F6y6bNEzxhFn3gkxubwElu1KPdFHuRKzICDsfPO9&notify_self=1}
    depends_on:
      - backend
    networks:
      - resto_net

  # ============================================================================
  # BACKEND: Laravel PHP 8.4-FPM (Pre-built in GitHub Actions)
  # ============================================================================
  backend:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-wildanbelfiore/moc_test}/backend:${IMAGE_TAG:-latest}
    container_name: resto_coolify_backend
    restart: always
    expose:
      - "9000"
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-db_moc}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-manchester}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      PIESOCKET_CLUSTER_ID: ${PIESOCKET_CLUSTER_ID:-free.blr2}
      PIESOCKET_API_KEY: ${PIESOCKET_API_KEY:-F6y6bNEzxhFn3gkxubwElu1KPdFHuRKzICDsfPO9}
      PIESOCKET_API_SECRET: ${PIESOCKET_API_SECRET:-Tsi2GnghMJFvYtBnm7n1T9SxvgFVOD67}
      PIESOCKET_CHANNEL_ID: ${PIESOCKET_CHANNEL_ID:-1}
    volumes:
      - backend_storage:/var/www/storage
      - backend_public_storage:/var/www/public/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resto_net

  # ============================================================================
  # QUEUE WORKER: Laravel Redis Background Worker
  # ============================================================================
  queue-worker:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-wildanbelfiore/moc_test}/backend:${IMAGE_TAG:-latest}
    container_name: resto_coolify_queue_worker
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-db_moc}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-manchester}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - backend_storage:/var/www/storage
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - resto_net

  # ============================================================================
  # CACHE & QUEUE: Redis 7 Alpine
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: resto_coolify_redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resto_net

  # ============================================================================
  # DATABASE: PostgreSQL 17 Alpine
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: resto_coolify_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-manchester}
      POSTGRES_DB: ${DB_DATABASE:-db_moc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-db_moc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resto_net

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  backend_public_storage:

networks:
  resto_net:
    driver: bridge

