services:
  # ============================================================================
  # DATABASE: PostgreSQL 18
  # ============================================================================
  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/wildan190/moc_test/postgres:18-alpine}
    container_name: resto_production_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-manchester}
      POSTGRES_DB: ${DB_DATABASE:-db_moc}
    volumes:
      - postgres_production_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-db_moc} || pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - resto_production_net

  # ============================================================================
  # CACHE & QUEUE: Redis 7
  # ============================================================================
  redis:
    image: ${REDIS_IMAGE:-ghcr.io/wildan190/moc_test/redis:7-alpine}
    container_name: resto_production_redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_production_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - resto_production_net

  # ============================================================================
  # BACKEND: Laravel PHP 8.4-FPM
  # ============================================================================
  backend:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-wildan190/moc_test}/backend:${IMAGE_TAG:-latest}
    container_name: resto_production_backend
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://api-dishy.phoenixtech.web.id}
      FRONTEND_URL: ${FRONTEND_URL:-https://dishy.phoenixtech.web.id}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-dishy.phoenixtech.web.id}
      APP_KEY: ${APP_KEY:-base64:7KqT41vL5Q0H9g1X6jR3sW8eF2mP0yA4zN8cT6vB1eI=}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-db_moc}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-manchester}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      PIESOCKET_CLUSTER_ID: ${PIESOCKET_CLUSTER_ID:-free.blr2}
      PIESOCKET_API_KEY: ${PIESOCKET_API_KEY:-F6y6bNEzxhFn3gkxubwElu1KPdFHuRKzICDsfPO9}
      PIESOCKET_API_SECRET: ${PIESOCKET_API_SECRET:-Tsi2GnghMJFvYtBnm7n1T9SxvgFVOD67}
      PIESOCKET_CHANNEL_ID: ${PIESOCKET_CHANNEL_ID:-1}
    volumes:
      - backend_storage:/var/www/storage
      - backend_public_storage:/var/www/public/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resto_production_net

  # ============================================================================
  # QUEUE WORKER: Laravel Background Worker (Redis)
  # ============================================================================
  queue-worker:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-wildan190/moc_test}/backend:${IMAGE_TAG:-latest}
    container_name: resto_production_queue_worker
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-base64:7KqT41vL5Q0H9g1X6jR3sW8eF2mP0yA4zN8cT6vB1eI=}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-db_moc}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-manchester}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - backend_storage:/var/www/storage
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resto_production_net

  # ============================================================================
  # FRONTEND: Next.js (Standalone Multi-stage Runner)
  # ============================================================================
  frontend:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-wildan190/moc_test}/frontend:${IMAGE_TAG:-latest}
    container_name: resto_production_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api-dishy.phoenixtech.web.id/api}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dishy.phoenixtech.web.id}
      NEXT_PUBLIC_PIESOCKET_CLUSTER_ID: ${PIESOCKET_CLUSTER_ID:-free.blr2}
      NEXT_PUBLIC_PIESOCKET_API_KEY: ${PIESOCKET_API_KEY:-F6y6bNEzxhFn3gkxubwElu1KPdFHuRKzICDsfPO9}
      NEXT_PUBLIC_PIESOCKET_CHANNEL_ID: ${PIESOCKET_CHANNEL_ID:-1}
      NEXT_PUBLIC_PIESOCKET_WS_URL: ${NEXT_PUBLIC_PIESOCKET_WS_URL:-wss://free.blr2.piesocket.com/v3/1?api_key=F6y6bNEzxhFn3gkxubwElu1KPdFHuRKzICDsfPO9&notify_self=1}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - resto_production_net

  # ============================================================================
  # NGINX: Unified Reverse Proxy
  # ============================================================================
  nginx:
    image: ${NGINX_IMAGE:-ghcr.io/wildan190/moc_test/nginx:alpine}
    container_name: resto_production_nginx
    restart: always
    expose:
      - "80"
    environment:
      - SERVICE_FQDN_NGINX_80=${SERVICE_FQDN_NGINX_80:-https://dishy.phoenixtech.web.id,https://api-dishy.phoenixtech.web.id}
    volumes:
      - backend_public_storage:/var/www/public/storage:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - resto_production_net

  # ============================================================================
  # METRICS: cAdvisor (container metrics exporter)
  # ============================================================================
  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.49.1}
    container_name: resto_production_cadvisor
    restart: always
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - resto_production_net

  # ============================================================================
  # METRICS: Prometheus (scrape & storage)
  # ============================================================================
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    container_name: resto_production_prometheus
    restart: always
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      cadvisor:
        condition: service_healthy
    networks:
      - resto_production_net

  # ============================================================================
  # METRICS: Grafana (dashboard)
  # ============================================================================
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.3.0}
    container_name: resto_production_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-https://grafana-dishy.phoenixtech.web.id}
      SERVICE_FQDN_GRAFANA_3000: ${GRAFANA_URL:-https://grafana-dishy.phoenixtech.web.id}
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
    volumes:
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - resto_production_net

# ==============================================================================
# Inline configs (butuh Docker Compose v2.23+)
# ==============================================================================
configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]
  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  postgres_production_data:
    name: resto_postgres_data_v18
  redis_production_data:
    name: resto_redis_data
  backend_storage:
    name: resto_backend_storage
  backend_public_storage:
    name: resto_backend_public_storage
  prometheus_data:
    name: resto_prometheus_data
  grafana_data:
    name: resto_grafana_data

# ==============================================================================
# Isolated Production Network
# ==============================================================================
networks:
  resto_production_net:
    name: resto_production_network
    driver: bridge