services:
  # ============================================================================
  # DATABASE: PostgreSQL 17
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: resto_production_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-manchester}
      POSTGRES_DB: ${DB_DATABASE:-db_dishy}
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-db_moc}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resto_production_net

  # ============================================================================
  # CACHE & QUEUE: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: resto_production_redis
    restart: always
    command: >
      redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_production_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resto_production_net

  # ============================================================================
  # BACKEND: Laravel PHP 8.4-FPM
  # Prebuilt via GitHub Actions to eliminate server build CPU/RAM overhead
  # ============================================================================
  backend:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-wildanbelfiore/moc_test}/backend:${IMAGE_TAG:-latest}
    build:
      context: ../backend-restaurant
      dockerfile: Dockerfile.prod
    container_name: resto_production_backend
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-db_moc}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-manchester}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      PIESOCKET_CLUSTER_ID: ${PIESOCKET_CLUSTER_ID:-free.blr2}
      PIESOCKET_API_KEY: ${PIESOCKET_API_KEY}
      PIESOCKET_API_SECRET: ${PIESOCKET_API_SECRET}
      PIESOCKET_CHANNEL_ID: ${PIESOCKET_CHANNEL_ID:-1}
    volumes:
      - backend_storage:/var/www/storage
      - backend_public_storage:/var/www/public/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resto_production_net

  # ============================================================================
  # QUEUE WORKER: Laravel Background Worker (Redis)
  # Uses the exact same prebuilt backend image, zero server compilation overhead
  # ============================================================================
  queue-worker:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-wildanbelfiore/moc_test}/backend:${IMAGE_TAG:-latest}
    container_name: resto_production_queue_worker
    restart: always
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-db_moc}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-manchester}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - backend_storage:/var/www/storage
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - resto_production_net

  # ============================================================================
  # FRONTEND: Next.js (Standalone Multi-stage Runner)
  # Prebuilt via GitHub Actions, minimal alpine image (< 180MB)
  # ============================================================================
  frontend:
    image: ${CONTAINER_REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-wildanbelfiore/moc_test}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ../frontend-restaurant
      dockerfile: Dockerfile
    container_name: resto_production_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      NEXT_PUBLIC_PIESOCKET_CLUSTER_ID: ${PIESOCKET_CLUSTER_ID:-free.blr2}
      NEXT_PUBLIC_PIESOCKET_API_KEY: ${PIESOCKET_API_KEY}
      NEXT_PUBLIC_PIESOCKET_CHANNEL_ID: ${PIESOCKET_CHANNEL_ID:-1}
      NEXT_PUBLIC_PIESOCKET_WS_URL: ${NEXT_PUBLIC_PIESOCKET_WS_URL}
    depends_on:
      - backend
    networks:
      - resto_production_net

  # ============================================================================
  # NGINX: Unified Reverse Proxy (Port 80/443)
  # Routes /api and /storage to backend, all other routes to frontend Next.js
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: resto_production_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_public_storage:/var/www/public/storage:ro
    depends_on:
      - frontend
      - backend
    networks:
      - resto_production_net

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  postgres_production_data:
    name: resto_postgres_data
  redis_production_data:
    name: resto_redis_data
  backend_storage:
    name: resto_backend_storage
  backend_public_storage:
    name: resto_backend_public_storage

# ==============================================================================
# Isolated Production Network
# ==============================================================================
networks:
  resto_production_net:
    name: resto_production_network
    driver: bridge
